<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>酒店布局工作台 · 永夜旅馆</title><link rel="stylesheet" href="./src/hotel-editor.css"></head><body>
<header><a class="brand" href="./index.html">NH<span>永夜旅馆<br><small>LAYOUT STUDIO</small></span></a><div class="document-name"><input id="name" aria-label="酒店布局名称" maxlength="80"><span id="save-status">默认布局</span></div><nav><button id="undo" title="Ctrl + Z">撤销</button><button id="redo" title="Ctrl + Y">重做</button><button id="save">保存草稿</button><button id="export">导出 JSON</button><button id="import">导入</button><button id="preview" class="primary">进入酒店试玩 ↗</button></nav></header>
<main><aside class="tools"><div class="section-title">01 / 编辑工具</div><div id="tools"></div><label class="field">大厅类型<select id="hall-type"><option value="reception">接待大厅</option><option value="lounge">休息厅</option><option value="banquet">宴会厅</option><option value="atrium">中庭</option></select></label><div class="section-title">02 / 文件</div><button id="png">导出地图图片</button><button id="reset">还原默认布局</button><details><summary>地图尺寸</summary><label>列数 <input id="width" type="number" min="32" max="80"></label><label>行数 <input id="height" type="number" min="27" max="64"></label><button id="resize">应用尺寸</button><p>缩小会裁剪边缘，可撤销。设施超出边界时不能试玩。</p></details><p class="note">每个大厅对应一个供电区。P 编号配电箱可拖动，通道颜色显示对应供电范围。草稿只在本机保存，普通游戏仍使用默认布局。</p></aside>
<section class="workspace"><div class="canvas-top"><strong id="tool-hint">选择物件后拖动位置</strong><span>空格 + 拖动 / 中键拖动平移 · 滚轮缩放</span></div><div id="canvas-host"><canvas id="plan" aria-label="酒店布局画布" tabindex="0"></canvas><div class="zoom"><button id="zoom-out" aria-label="缩小">−</button><output id="zoom-value">100%</output><button id="zoom-in" aria-label="放大">＋</button><button id="fit">适合窗口</button></div><div id="toast" role="status" aria-live="polite"></div></div><footer><span id="coordinates">坐标 —</span><span id="counts"></span><label><input id="power-zones" type="checkbox" checked> 供电分区</label><label><input id="rays" type="checkbox" checked> 镜头朝向</label><label><input id="grid" type="checkbox" checked> 网格</label></footer></section>
<aside class="inspector"><div class="section-title">03 / 物件属性</div><div id="inspector"><h2>选择一个物件</h2><p>点击标记，拖动即可移动。大厅可用矩形工具建立；摄像头可以调整方向、视角和高度。</p></div><div class="section-title">04 / 布局检查</div><div id="validation" aria-live="polite"></div><details open><summary>物件列表</summary><div id="entities"></div></details></aside></main>
<input id="file" type="file" accept=".json,application/json" hidden><script type="module" src="./src/hotel-editor.js"></script></body></html>
